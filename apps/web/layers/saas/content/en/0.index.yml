title: Build your next service on a <span class="text-primary">clean foundation</span>
description: Talred Services.com Starter brings together Nuxt, a domain-driven Laravel API, Identity, and local development tooling in one practical starting point.
seo:
  title: Talred Services.com Starter — A foundation for your next service
  description: Explore the Nuxt, Laravel, Identity, and local development foundations included in Talred Services.com Starter.
navigation: false

hero:
  links:
    - label: Manage projects in Identity
      trailing: true
      to: /identity
      size: xl
    - label: Explore the architecture
      icon: i-lucide-list-checks
      size: xl
      color: neutral
      variant: subtle
      to: /about

sections: []

features:
  title: A working foundation for full-stack services
  description: Start with clear boundaries and useful integrations, then shape the domain and workflows your product needs.
  items:
    - title: Nuxt application and BFF
      description: Build localized interfaces and keep browser-facing server operations and private credentials behind the Nuxt server boundary.
      icon: i-lucide-layout-dashboard
    - title: Laravel API with clear layers
      description: Keep business rules in the domain, coordinate use cases in the application layer, and expose explicit API contracts.
      icon: i-lucide-folder-kanban
    - title: Shared Identity integration
      description: Connect sign-in and account flows through application clients while keeping each demo's identity data isolated.
      icon: i-lucide-shield-check
    - title: Local development stack
      description: Run the web app, APIs, and supporting services through the workspace's documented Compose setup.
      icon: i-simple-icons-docker

trust:
  headline: Made to be explored
  title: Start with examples, then make them yours
  description: The included Talred Identity, Talred Tasks, and Fresh SaaS examples show how the starter pieces fit together. They are reference implementations for exploration, not a finished commercial product.
  items:
    - title: Inspectable architecture
      description: Follow the code from browser-facing UI and BFF routes through API contracts and domain behavior.
      icon: i-lucide-file-text
    - title: Separate demonstrations
      description: Explore Identity, Tasks, and Fresh SaaS as focused examples with distinct purposes and application clients.
      icon: i-lucide-check-circle-2
    - title: Product-owned decisions
      description: Add your business rules, integrations, deployment choices, and product policies to the foundation.
      icon: i-lucide-orbit

faq:
  headline: About the Starter
  title: What is included and what is yours to define?
  description: A quick orientation to the foundation and its demonstrations.
  items:
    - title: Is Talred Services.com Starter a finished application?
      description: No. It is a development foundation with working examples. You define the product domain, user-facing features, and commercial offer for your application.
    - title: What can I explore here?
      description: Talred Identity demonstrates shared authentication and access. Talred Tasks follows a Nuxt BFF through to a Laravel API organized with domain-driven design and clean architecture. Fresh SaaS shows how public product pages and a protected dashboard can fit together.
    - title: Does the starter include a public price list?
      description: No commercial pricing is published for this foundation. The pricing page explains what is and is not offered by this demo.
    - title: Which technologies are used?
      description: The current stack includes Nuxt, TypeScript, PHP, Laravel, Talred Identity, MySQL, and Docker Compose.

testimonials:
  headline: Foundation, not product claims
  title: Examples you can inspect
  description: This site describes the starter and its included demonstrations rather than presenting invented customer stories.
  items: []

cta:
  title: Open the Identity control plane
  description: Manage projects and their hosted applications in Talred Identity, or review the architecture before adapting the foundation to your service.
  links:
    - label: Manage projects in Identity
      to: /identity
      trailingIcon: i-lucide-arrow-right
    - label: Browse the demos
      to: /#demos
      variant: subtle
      icon: i-lucide-panels-top-left
