title: Bâtissez votre prochain service sur une <span class="text-primary">base claire</span>
description: Talred Services.com Starter réunit Nuxt, une API Laravel guidée par le domaine, Identity et les outils de développement local dans une base pratique.
seo:
  title: Talred Services.com Starter — Une base pour votre prochain service
  description: Découvrez les fondations Nuxt, Laravel, Identity et développement local incluses dans Talred Services.com Starter.
navigation: false

hero:
  links:
    - label: Gérer les projets dans Identity
      trailing: true
      to: /identity
      size: xl
    - label: Explorer l’architecture
      icon: i-lucide-list-checks
      size: xl
      color: neutral
      variant: subtle
      to: /about

sections: []

features:
  title: Une base fonctionnelle pour les services full-stack
  description: Commencez avec des frontières claires et des intégrations utiles, puis façonnez le domaine et les processus de votre produit.
  items:
    - title: Application Nuxt et BFF
      description: Créez des interfaces localisées et gardez les opérations serveur du navigateur ainsi que les identifiants privés derrière le serveur Nuxt.
      icon: i-lucide-layout-dashboard
    - title: API Laravel organisée en couches
      description: Gardez les règles métier dans le domaine, coordonnez les cas d’usage dans la couche application et exposez des contrats API explicites.
      icon: i-lucide-folder-kanban
    - title: Intégration à Identity
      description: Reliez la connexion et les comptes à des clients d’application, tout en isolant les données d’identité de chaque démonstration.
      icon: i-lucide-shield-check
    - title: Stack de développement local
      description: Lancez l’application web, les API et les services associés avec la configuration Compose documentée de l’espace de travail.
      icon: i-simple-icons-docker

trust:
  headline: À explorer
  title: Partez des exemples, puis adaptez-les
  description: Les exemples Talred Identity, Talred Tasks et Fresh SaaS montrent comment les composants du starter s’intègrent. Ce sont des références à explorer, pas un produit commercial terminé.
  items:
    - title: Architecture inspectable
      description: Suivez le code de l’interface et du BFF jusqu’aux contrats API et au comportement du domaine.
      icon: i-lucide-file-text
    - title: Démonstrations distinctes
      description: Découvrez Identity, Tasks et Fresh SaaS comme des exemples ciblés aux objectifs et aux clients d’application distincts.
      icon: i-lucide-check-circle-2
    - title: Décisions propres au produit
      description: Ajoutez vos règles métier, intégrations, choix de déploiement et politiques produit à cette base.
      icon: i-lucide-orbit

faq:
  headline: À propos du Starter
  title: Qu’est-ce qui est inclus et que reste-t-il à définir ?
  description: Quelques repères sur la base et ses démonstrations.
  items:
    - title: Talred Services.com Starter est-il une application terminée ?
      description: Non. C’est une base de développement accompagnée d’exemples fonctionnels. Vous définissez le domaine métier, les fonctions visibles et l’offre commerciale de votre application.
    - title: Que puis-je explorer ici ?
      description: Talred Identity illustre l’authentification et les accès partagés. Talred Tasks suit un BFF Nuxt jusqu’à une API Laravel organisée selon le DDD et l’architecture propre. Fresh SaaS montre comment associer des pages produit publiques à un tableau de bord protégé.
    - title: Cette base publie-t-elle une grille tarifaire ?
      description: Aucun tarif commercial n’est publié pour cette base. La page des tarifs précise ce que cette démonstration propose ou non.
    - title: Quelles technologies sont utilisées ?
      description: La stack actuelle comprend Nuxt, TypeScript, PHP, Laravel, Talred Identity, MySQL et Docker Compose.

testimonials:
  headline: Une base, pas des promesses produit
  title: Des exemples que vous pouvez examiner
  description: Ce site présente le starter et ses démonstrations, sans inventer de témoignages clients.
  items: []

cta:
  title: Ouvrez le plan de contrôle Identity
  description: Gérez les projets et leurs applications hébergées dans Talred Identity, ou examinez l’architecture avant d’adapter cette base.
  links:
